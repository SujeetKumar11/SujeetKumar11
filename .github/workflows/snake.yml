name: Generate Profile Assets

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        env:
          USER: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          python3 <<'PY'
          import json
          import os
          import urllib.request

          user = os.environ["USER"]
          headers = {"User-Agent": "profile-stats-generator"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          profile = get(f"https://api.github.com/users/{user}")
          repos = []
          page = 1
          while True:
              batch = get(
                  f"https://api.github.com/users/{user}/repos?per_page=100&page={page}&type=owner"
              )
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          total_stars = sum(r.get("stargazers_count", 0) for r in repos)
          public_repos = profile.get("public_repos", len(repos))
          followers = profile.get("followers", 0)
          forks = sum(r.get("forks_count", 0) for r in repos)

          title = f"{user}'s GitHub Stats"
          lines = [
              ("Total Stars", str(total_stars)),
              ("Public Repos", str(public_repos)),
              ("Followers", str(followers)),
              ("Forks", str(forks)),
          ]

          width, height = 495, 195
          y = 56
          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
              f'<rect width="{width}" height="{height}" fill="#0A0A0A" rx="4.5"/>',
              f'<text x="35" y="35" fill="#F5D76E" font-family="Segoe UI, Ubuntu, sans-serif" font-size="18" font-weight="600">{title}</text>',
          ]

          for label, value in lines:
              svg.append(
                  f'<text x="35" y="{y}" fill="#EAEAEA" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">{label}: <tspan fill="#F5D76E" font-weight="700">{value}</tspan></text>'
              )
              y += 28

          svg.append("</svg>")
          with open("dist/stats.svg", "w", encoding="utf-8") as fh:
              fh.write("\n".join(svg))
          PY

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0A0A0A&title_color=F5D76E&text_color=EAEAEA
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        run: |
          mkdir -p dist
          curl -fsSL "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0A0A0A&ring=F5D76E&fire=F5D76E&currStreakLabel=F5D76E" -o dist/streak.svg

      - name: Generate contribution snakes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-batman.svg?color_snake=#F5D76E&color_dots=#0A0A0A,#1A1A1A,#4A4200,#8A7A00,#F5D76E
            dist/github-contribution-grid-snake.gif?color_snake=#F5D76E&color_dots=#0A0A0A,#1A1A1A,#4A4200,#8A7A00,#F5D76E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
